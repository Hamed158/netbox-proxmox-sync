---
- name: Sync Proxmox QEMU VMs into NetBox
  hosts: proxmox_all_qemu
  connection: local
  gather_facts: false

  vars:
    netbox_url: "{{ lookup('env', 'NETBOX_URL') }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"

  tasks:
    - name: Ensure pynetbox is installed to a writable location
      ansible.builtin.pip:
        name: pynetbox
        extra_args: "--target=/tmp/py-libs"
      delegate_to: localhost
      run_once: true

    - name: Map status and vCPUs
      ansible.builtin.set_fact:
        nb_status: "{{ 'active' if proxmox_status == 'running' else 'offline' }}"
        nb_vcpus: "{{ (proxmox_cores | int) * (proxmox_sockets | default(1) | int) }}"

    - name: Ensure QEMU VM exists in NetBox
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "{{ proxmox_name }}"
          cluster: "{{ proxmox_node }}"
          status: "{{ nb_status }}"
          vcpus: "{{ nb_vcpus }}"
          memory: "{{ proxmox_memory }}"
        state: present
      environment:
        PYTHONPATH: /tmp/py-libs

    - name: Query guest agent for network interfaces
      ansible.builtin.uri:
        url: "{{ lookup('env', 'PROXMOX_URL') }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ proxmox_vmid }}/agent/network-get-interfaces"
        headers:
          Authorization: "PVEAPIToken={{ lookup('env','PROXMOX_USER') }}!{{ lookup('env','PROXMOX_TOKEN_ID') }}={{ lookup('env','PROXMOX_TOKEN_SECRET') }}"
        validate_certs: false
        method: GET
        status_code: [200, 500]
      register: agent_net
      delegate_to: localhost
      ignore_errors: true

    - name: Determine interface and IP from guest agent data
      ansible.builtin.set_fact:
        vm_ip: "{{ item['ip-addresses'] | selectattr('ip-address-type','equalto','ipv4') | map(attribute='ip-address') | list | first }}"
        vm_iface: "{{ item.name }}"
      loop: "{{ agent_net.json.data.result | default([]) }}"
      when:
        - agent_net.status == 200
        - agent_net.json.data is not none
        - item.name != 'lo'
        - vm_ip is not defined
        - (item['ip-addresses'] | selectattr('ip-address-type','equalto','ipv4') | list | length) > 0

    - name: Ensure VM interface exists in NetBox
      netbox.netbox.netbox_vm_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "{{ vm_iface }}"
          virtual_machine: "{{ proxmox_name }}"
        state: present
      when: vm_ip is defined
      environment:
        PYTHONPATH: /tmp/py-libs

    - name: Ensure IP address exists and is assigned
      netbox.netbox.netbox_ip_address:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          address: "{{ vm_ip }}/24"
          assigned_object:
            virtual_machine: "{{ proxmox_name }}"
            name: "{{ vm_iface }}"
          status: active
        state: present
      when: vm_ip is defined
      environment:
        PYTHONPATH: /tmp/py-libs

    - name: Set primary IPv4 on the VM
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "{{ proxmox_name }}"
          cluster: "{{ proxmox_node }}"
          primary_ip4: "{{ vm_ip }}/24"
        state: present
      when: vm_ip is defined
      environment:
        PYTHONPATH: /tmp/py-libs

- name: Sync Proxmox LXC containers into NetBox
  hosts: proxmox_all_lxc
  connection: local
  gather_facts: false

  vars:
    netbox_url: "{{ lookup('env', 'NETBOX_URL') }}"
    netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"

  tasks:
    - name: Ensure pynetbox is installed to a writable location
      ansible.builtin.pip:
        name: pynetbox
        extra_args: "--target=/tmp/py-libs"
      delegate_to: localhost
      run_once: true

    - name: Map status
      ansible.builtin.set_fact:
        nb_status: "{{ 'active' if proxmox_status == 'running' else 'offline' }}"

    - name: Ensure LXC container exists in NetBox
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: false
        data:
          name: "{{ proxmox_hostname }}"
          cluster: "{{ proxmox_node }}"
          status: "{{ nb_status }}"
          vcpus: "{{ proxmox_cores }}"
          memory: "{{ proxmox_memory }}"
        state: present
      environment:
        PYTHONPATH: /tmp/py-libs
